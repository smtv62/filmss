name: M3U Playlist Bot

on:
  schedule:
    - cron: '0 16 * * 3,5' # Çarşamba ve Cuma günleri saat 16:00'da
  workflow_dispatch: # Manuel tetikleme seçeneği

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 curl_cffi requests

    - name: Botu Çalıştır (Generator)
      run: python generator.py

    - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        git config --global user.addSafeDirectory '*'
        
        if [ -f playlist.m3u ]; then
          git add playlist.m3u
          git diff --quiet && git diff --cached --quiet || (git commit -m "M3U liste güncellendi: $(date +'%Y-%m-%d')" && git push)
        else
          echo "⚠️ playlist.m3u dosyası oluşturulamadı, işlem atlanıyor."
        fi

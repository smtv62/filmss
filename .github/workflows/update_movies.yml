name: Stream Yakalayici Bot

on:
  schedule:
    # Çarşamba ve Cuma günleri saat 16:00'da çalışır (UTC saatine göre ayarlanabilir)
    - cron: '0 13 * * 3,5' 
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps
        
    - name: Depoyu Kopyala (Checkout)
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Botu Çalıştır (Generator)
      run: python generator.py

    - name: Değişiklikleri GitHub'a Kaydet (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        git add movies.json
        git diff --quiet && git diff --cached --quiet || (git commit -m "Otomatik film listesi güncellendi: $(date +'%Y-%m-%d')" && git push)
